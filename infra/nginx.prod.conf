gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 6;

server {
    listen 80;
    server_name _;

    client_max_body_size 15m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy — strips /api prefix, forwards to backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;

        # Never expose internal error details
        proxy_intercept_errors off;
    }

    # Images served directly — no Python in the loop
    location /images/ {
        alias /data/images/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Prevent directory traversal
        location ~ /\. { deny all; }
    }

    # Static assets with content hashes — cache forever
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|svg|ico|jpg|jpeg|gif|webp)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # React SPA — never cache index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
