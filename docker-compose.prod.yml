services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 192m

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/Dockerfile.backend
    env_file: .env.prod
    environment:
      IMAGE_STORAGE_PATH: /data/images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/images:/data/images:z
      - clip_cache:/root/.cache/clip
    expose:
      - "8000"
    command: >
      sh -c "alembic -c /app/migrations/alembic.ini upgrade head &&
             gunicorn main:app
             --worker-class uvicorn.workers.UvicornWorker
             --workers 2
             --bind 0.0.0.0:8000
             --timeout 120
             --access-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024m

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/Dockerfile.frontend
      args:
        VITE_API_URL: /api
        VITE_APP_NAME: ThriftOS
    expose:
      - "80"
    restart: always
    deploy:
      resources:
        limits:
          memory: 64m

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx.prod.conf:/etc/nginx/conf.d/default.conf:z
      - ./data/images:/data/images:ro,z
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
    restart: always
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  postgres_data:
  redis_data:
  clip_cache:
